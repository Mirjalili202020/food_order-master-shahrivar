<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>جزئیات غذا</title>

    <link rel="stylesheet" href="style-polished.css" />
  </head>

  <body>
    <h1>جزئیات غذا</h1>

    <!-- منوی اصلی سایت -->
    <nav>
      <a href="index.html">صفحه اصلی</a>

      <a href="cart.html">
        سبد سفارش
        <span id="cart-count">0</span>
      </a>

      <a href="profile.html">پروفایل</a>

      <a href="orders.html">تاریخچه سفارش‌ها</a>
    </nav>

    <!-- بخش جزئیات غذا -->
    <section class="food-details">
      <!-- تصویر غذا -->
      <img id="food-image" src="" alt="" />

      <!-- اطلاعات غذا -->
      <div class="food-details-info">
        <h2 id="food-name"></h2>

        <p id="food-description"></p>

        <h3>مواد تشکیل‌دهنده</h3>

        <ul id="food-ingredients"></ul>

        <p id="food-price" class="price"></p>
        <!-- بخش امتیاز ستاره‌ای -->
        <div class="food-rating">
          <h3>به این غذا امتیاز بده:</h3>

          <div id="star-rating" aria-label="امتیاز غذا">
            <button
              type="button"
              class="rating-star"
              data-rating="1"
              aria-label="۱ ستاره"
            >
              ★
            </button>
            <button
              type="button"
              class="rating-star"
              data-rating="2"
              aria-label="۲ ستاره"
            >
              ★
            </button>
            <button
              type="button"
              class="rating-star"
              data-rating="3"
              aria-label="۳ ستاره"
            >
              ★
            </button>
            <button
              type="button"
              class="rating-star"
              data-rating="4"
              aria-label="۴ ستاره"
            >
              ★
            </button>
            <button
              type="button"
              class="rating-star"
              data-rating="5"
              aria-label="۵ ستاره"
            >
              ★
            </button>
          </div>

          <p id="rating-message" aria-live="polite">
            هنوز امتیازی ثبت نکرده‌اید.
          </p>
        </div>

        <!-- لینک بازگشت به منو -->
        <a href="index.html" class="back-to-menu"> ← بازگشت به منوی غذاها </a>
      </div>
    </section>

    <!-- فایل اطلاعات غذا -->
    <script src="food-details.js"></script>

    <!-- شمارنده سبد -->
    <script src="cart-count.js"></script>
  </body>
</html>
